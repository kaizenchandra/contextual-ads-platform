# Development reference only. Supply externally managed PostgreSQL and real secrets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contextual-ads
spec:
  replicas: 2
  selector:
    matchLabels: { app: contextual-ads }
  template:
    metadata:
      labels: { app: contextual-ads }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: backend
          image: contextual-ads:0.1.0
          ports: [ { containerPort: 8080 } ]
          envFrom: [ { secretRef: { name: contextual-ads } } ]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: '2', memory: 1Gi }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ ALL ] } }
---
apiVersion: v1
kind: Service
metadata: { name: contextual-ads }
spec:
  selector: { app: contextual-ads }
  ports: [ { port: 8080, targetPort: 8080 } ]
