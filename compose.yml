services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: ads
      POSTGRES_USER: ads
      POSTGRES_PASSWORD: local-only
    ports: [ "127.0.0.1:5432:5432" ]
    volumes: [ "db:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ads" ]
      interval: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-change-me
      KC_HOSTNAME: http://localhost:8186
    ports: [ "127.0.0.1:8186:8080" ]
    volumes: [ "./docker/keycloak:/opt/keycloak/data/import:ro" ]
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9096
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9096
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: [ "127.0.0.1:9096:9096" ]
    volumes: [ "kafka:/var/lib/kafka/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ads
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OIDC_ISSUER: http://localhost:8186/realms/contextads
      OIDC_JWKS: http://keycloak:8080/realms/contextads/protocol/openid-connect/certs
    ports: [ "127.0.0.1:8086:8080" ]
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      AUTH_URL: http://localhost:3006
      AUTH_SECRET: local-session-encryption-key-change-before-deployment-12345
      OIDC_ISSUER: http://localhost:8186/realms/contextads
      OIDC_INTERNAL_ORIGIN: http://keycloak:8080
      OIDC_CLIENT_SECRET: local-web-secret-change-me
      NEXT_PUBLIC_TRACKING_URL: http://localhost:8086
    ports: [ "127.0.0.1:3006:3000" ]
    depends_on: [ backend, keycloak ]
volumes:
  kafka:
  db:
