name: checks
on: [ push, pull_request ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: docker compose build assets
      - run: mvn -B -f backend/pom.xml verify
      - run: npm ci && npm run build && npm run typecheck
        working-directory: frontend
      - run: docker compose up --build -d
      - name: Wait for local platform
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8086/actuator/health && curl -fsS http://localhost:8186/realms/contextads/.well-known/openid-configuration; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: npx playwright install --with-deps chromium && npx playwright test --workers=1
        working-directory: frontend
      - run: python3 tests/smoke.py
      - run: python3 tests/isolated_renderer.py
      - if: always()
        run: docker compose down
